<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacman Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pacman Online</h1>

    <div id="game-container">

        <canvas
            id="gameCanvas"
            width="600"
            height="400">
        </canvas>

        <div id="ranking">
            <h3>Ranking</h3>
            <ul id="ranking-list"></ul>
        </div>

    </div>

    <div id="info">
        <p>Jugador: <span id="playerName"></span></p>
        <p>Puntaje: <span id="score">0</span></p>
    </div>

    <script src="game.js"></script>

</body>
</html>
